[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "marcopolo-sdk"
version = "0.1.0"
description = "Python SDK for executing MarcoPolo MCP data operations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Immersa" },
]
urls = { Homepage = "https://github.com/immersa-co/marcopolo-python-sdk", Repository = "https://github.com/immersa-co/marcopolo-python-sdk", Issues = "https://github.com/immersa-co/marcopolo-python-sdk/issues" }
keywords = ["marcopolo", "mcp", "client", "data"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=1.28.1,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pytest>=8.3.0",
  "ruff>=0.5.0",
  "twine>=5.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/marcopolo"]

[tool.hatch.build]
exclude = [
  ".venv*/",
  "build/",
  "dist/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
]
